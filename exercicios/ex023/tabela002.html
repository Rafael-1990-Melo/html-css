<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: gray;
        }
        td, th {
            border: 1px solid black;
            padding: 10px;
        }
        thead, tfoot {
            background-color: black;
            color: white;
        }
        tbody > tr:nth-child(even) {
            background-color: aqua;
        }
        tbody > tr:nth-child(odd) {
            background-color: lightgray;
        }
        td.num {
            text-align: right;
        }
    
        
    </style>
    
</head>
<body>
    <h1>
        Uso de tabelas grandes
    </h1>
    <table>
        <caption>Populacao das unidades federativas</caption>
      <thead>
         <tr>
            <th scope="col">
                Estado
            </th>
            <th scope="col">
                Populacao
            </th>
         </tr>
      </thead>
      <tbody>
         <tr>
            <td>Sao Paulo</td>
            <td class="num">49.100.300</td>
         </tr>
         <tr>
            <td>Minas gerais</td>
            <td class="num">988.099.100</td>
         </tr>
         <tr>
            <td>Rio de janeiro</td>
            <td class="num">899.300.300</td>
         </tr>
      </tbody>
      <tfoot>
         <tr>
            <th scope="row">Total de habitantes</th>
            <td class="num">90000</td>
         </tr>
      </tfoot>
    </table>
    
</body>
</html>
