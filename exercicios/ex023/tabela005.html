<!DOCTYPE html>
<html lang="">pt-br
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            padding: 8px;
            font-weight: bolder;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        tr.destaque {
            background-color: aquamarine;
        }

        col.cnome {
            background-color: aqua;
        }

        col.cgrupo {
            background-color: yellow;
        }

        .amarelo {
            background-color: yellow;
        }

        .vermelho {
            background-color: red;
        }
        
    </style>
</head>
<body>
    <h1>Exercicios de tabela</h1>

    <table>
        <colgroup>
            <col class="amarelo">
            <col class="vermelho">
            <col>
            <col>
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>João</td>
            <td>Masculino</td>
            <td>37</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Julia</td>
            <td>Feminino</td>
            <td>22</td>
            <td>Advogada</td>
        </tr>
        <tr class="destaque">
            <td>Rafael</td>
            <td>Masculino</td>
            <td>36</td>
            <td>Motorista</td>
        </tr>
        <tr>
            <td>Barbara</td>
            <td>Feminino</td>
            <td>34</td>
            <td>Farmaceutica</td>
        </tr>
        <tr>
            <td>Mauricio</td>
            <td>Masculino</td>
            <td>41</td>
            <td>Estagiario</td>
        </tr>
    </table>
</body>
</html>
